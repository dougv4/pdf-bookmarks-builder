[package]
name = "pdf-bookmarks-builder-desktop"
version = "0.1.0"
description = "App desktop local para PDF Bookmarks Builder"
authors = ["Douglas Viana Gomes"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
rfd = "0.15.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
